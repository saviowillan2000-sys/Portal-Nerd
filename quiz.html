    <style>
        :root {
            --bg: #0b0e14;
            --surface: #141923;
            --surface-2: #1c2331;
            --accent: #ff2e63;
            --accent-2: #00d9f5;
            --ok: #22c55e;
            --err: #ef4444;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: #263042;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        header {
            background: linear-gradient(135deg, #1b1128 0%, #0b0e14 70%);
            border-bottom: 2px solid var(--accent);
            padding: 24px 16px;
            text-align: center;
        }
        header h1 { margin: 0; font-size: 24px; }
        nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 12px;
        }
        nav a {
            color: var(--text);
            text-decoration: none;
            background: var(--surface-2);
            border: 1px solid var(--border);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
        }
        nav a.active { border-color: var(--accent-2); color: var(--accent-2); }
        .container {
            max-width: 720px;
            margin: 24px auto;
            padding: 0 16px;
        }
        .box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
        }
        .quiz-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 14px;
            background: var(--surface-2);
            display: block;
        }
        .pergunta { font-size: 18px; font-weight: 700; margin-bottom: 16px; line-height: 1.35; }
        .opcao {
            display: block;
            width: 100%;
            text-align: left;
            padding: 12px 14px;
            margin-bottom: 10px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: var(--text);
            font-size: 15px;
            cursor: pointer;
        }
        .opcao:hover:not(:disabled) { border-color: var(--accent-2); }
        .opcao.correta { border-color: var(--ok); background: rgba(34, 197, 94, 0.16); }
        .opcao.errada { border-color: var(--err); background: rgba(239, 68, 68, 0.16); }
        .feedback {
            margin-top: 10px;
            padding: 12px;
            border-radius: 10px;
            background: var(--surface-2);
            color: #e2e8f0;
            font-size: 14px;
        }
        .btn-primario {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 12px 18px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            margin-top: 14px;
        }
        .resultado {
            margin: 12px 0 6px;
            font-size: 20px;
            font-weight: 800;
            color: var(--accent-2);
        }
        .sub-res {
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 12px;
        }
    </style>
</head>

0y%3D%22340%22%20width%3D%22210%22%20height%3D%228%22%20rx%3D%224%22%20fill%3D%22%23ff2e63%22/%3E%0A%3C/svg%3E"}];
        let indice = 0;
        let acertos = 0;
        let respondida = false;
        const box = document.getElementById('quiz-box');

        function renderResultado() {
            const total = perguntas.length;
            const pct = Math.round((acertos / total) * 100);
            let tituloRank = "Nível Iniciante";
            if (pct >= 80) tituloRank = "Mestre do Universo Nerd";
            else if (pct >= 50) tituloRank = "Veterano do Feed";

            box.innerHTML = `
                <div style="color:#00d9f5;font-size:13px;font-weight:700;">QUIZ CONCLUÍDO</div>
                <div class="resultado">Você acertou ${acertos} de ${total} perguntas (${pct}%)</div>
                <div class="sub-res">Classificação: <strong>${tituloRank}</strong></div>
                <button class="btn-primario" onclick="reiniciar()">Jogar Novamente</button>
                <a class="btn-primario" style="display:inline-block;text-decoration:none;background:#1c2331;border:1px solid #263042;margin-left:8px;" href="index.html">Voltar ao Feed</a>
            `;
        }

        function renderPergunta() {
            if (indice >= perguntas.length) {
                renderResultado();
                return;
            }
            respondida = false;
            const atual = perguntas[indice];
            const opcoesHtml = atual.opcoes.map((op, i) =>
                `<button class="opcao" id="opt-${i}" onclick="responder(${i})">${op}</button>`
            ).join('');

            box.innerHTML = `
                <div style="color:#94a3b8;font-size:13px;margin-bottom:8px;">Pergunta ${indice + 1} de ${perguntas.length} • Pontos: ${acertos}</div>
                <img class="quiz-img" src="${atual.imagem}" alt="Imagem da pergunta" onerror="this.onerror=null;this.src='${atual.fallback}';">
                <div class="pergunta">${atual.pergunta}</div>
                <div>${opcoesHtml}</div>
                <div id="feedback-area"></div>
            `;
        }

        function responder(escolha) {
            if (respondida) return;
            respondida = true;

            const atual = perguntas[indice];
            const botoesOpt = document.querySelectorAll('.opcao');
            botoesOpt.forEach(b => b.disabled = true);

            const escolhidaBtn = document.getElementById(`opt-${escolha}`);
            const corretaBtn = document.getElementById(`opt-${atual.correta}`);

            let statusTexto = "";
            if (escolha === atual.correta) {
                acertos++;
                if (escolhidaBtn) escolhidaBtn.classList.add('correta');
                statusTexto = "<strong style='color:#22c55e;'>✔ Resposta correta!</strong>";
            } else {
                if (escolhidaBtn) escolhidaBtn.classList.add('errada');
                if (corretaBtn) corretaBtn.classList.add('correta');
                statusTexto = `<strong style='color:#ef4444;'>✘ Quase!</strong> Resposta certa: <strong>${atual.opcoes[atual.correta]}</strong>.`;
            }

            const textoBotaoProx = (indice + 1 < perguntas.length) ? "Próxima Pergunta →" : "Ver Resultado Final →";
            document.getElementById('feedback-area').innerHTML = `
                <div class="feedback">
                    <div>${statusTexto}</div>
                    <div style="margin-top:6px;color:#94a3b8;">${atual.explicacao || ""}</div>
                </div>
                <button class="btn-primario" onclick="proxima()">${textoBotaoProx}</button>
            `;
        }

        function proxima() {
            indice++;
            renderPergunta();
        }

        function reiniciar() {
            indice = 0;
            acertos = 0;
            respondida = false;
            renderPergunta();
        }

        renderPergunta();
    </script>
